name: Matter-Base Rust verification

on:
  push:
    branches:
      - alpha
      - beta
      - stable
      - matter-beta
  pull_request:
    branches:
      - matter-beta
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matter-base-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Format, check, test, Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Install stable Rust and components
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies and build output
        uses: Swatinem/rust-cache@v2

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Verify all targets
        run: cargo check --all-targets --locked

      - name: Run all default tests
        run: cargo test --all-targets --locked

      - name: Verify documentation tests
        run: cargo test --doc --locked

      - name: Verify Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Verify mandatory decision and continuity records
        run: python3 scripts/check_continuity.py

      - name: Audit tracked README links, credits and secrets
        run: python3 scripts/verify_repository.py

      - name: Verify ecosystem rename plan
        run: python3 -m unittest discover -s test -p "test_naming.py" -v

      - name: Check WhatsApp operator setup script syntax
        run: bash -n scripts/whatsapp-test-setup.sh

      - name: Test read-only WhatsApp session inspector
        run: python3 -m unittest discover -s test -p "test_whatsapp_session_inspect.py" -v

      - name: Test read-only WhatsApp store comparison
        run: python3 -m unittest discover -s test -p "test_whatsapp_stores_compare.py" -v

      - name: Verify whitespace
        run: git diff --check HEAD^ HEAD

      - name: Check safe prebuilt WhatsApp launcher syntax
        run: bash -n scripts/whatsapp-vault-existing.sh
      - name: Build verified alpha controller binary
        if: github.event_name == 'push' && github.ref == 'refs/heads/alpha'
        run: cargo build --locked --bin whatsapp-matter-control

      - name: Package verified alpha controller (no secrets)
        if: github.event_name == 'push' && github.ref == 'refs/heads/alpha'
        shell: bash
        run: |
          mkdir -p dist-controller
          install -m 0755 target/debug/whatsapp-matter-control dist-controller/whatsapp-matter-control
          strip --strip-debug dist-controller/whatsapp-matter-control
          (cd dist-controller && sha256sum whatsapp-matter-control > SHA256SUMS)
          printf 'BASE_SHA=%s\n' "$GITHUB_SHA" > dist-controller/BUILD_INFO
          printf 'TARGET=x86_64-unknown-linux-gnu\n' >> dist-controller/BUILD_INFO

      - name: Publish verified controller artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/alpha'
        uses: actions/upload-artifact@v4
        with:
          name: base-alpha-control-linux-x86_64-${{ github.sha }}
          path: dist-controller/
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows stable Rust
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install stable Rust and Clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo dependencies and build output
        uses: Swatinem/rust-cache@v2

      - name: Verify all targets on Windows
        run: cargo check --all-targets --locked

      - name: Run default Windows tests
        run: cargo test --all-targets --locked

      - name: Verify strict Clippy on Windows
        run: cargo clippy --all-targets --locked -- -D warnings
