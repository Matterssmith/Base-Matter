name: Matter-Base Rust verification

on:
  push:
    branches:
      - matter-beta
  pull_request:
    branches:
      - matter-beta
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matter-base-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Format, check, test, Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install stable Rust and components
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies and build output
        uses: Swatinem/rust-cache@v2

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Verify all targets
        run: cargo check --all-targets --locked

      - name: Run all default tests
        run: cargo test --all-targets --locked

      - name: Verify documentation tests
        run: cargo test --doc --locked

      - name: Verify Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Verify whitespace
        run: git diff --check HEAD^ HEAD
