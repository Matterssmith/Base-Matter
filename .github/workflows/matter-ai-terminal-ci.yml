name: Matter-AI Ubuntu terminal (offline tests)

on:
  push:
    branches: [workstreams/02-base]
    paths:
      - 'tools/matter_ai.py'
      - 'tools/matter_branches.py'
      - 'tools/matter_autopilot.py'
      - 'tools/matter-autopilot.service'
      - 'tools/setup-sakura.sh'
      - 'tools/install-matter-ai.sh'
      - 'tests/test_matter_ai_cli.py'
      - 'tests/test_matter_branches.py'
      - 'tests/test_matter_autopilot.py'
      - '.github/workflows/matter-ai-terminal-ci.yml'
  pull_request:
    paths:
      - 'tools/matter_ai.py'
      - 'tools/install-matter-ai.sh'
      - 'tests/test_matter_ai_cli.py'
      - '.github/workflows/matter-ai-terminal-ci.yml'
permissions:
  contents: read

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python syntax
        run: python -m py_compile tools/matter_ai.py tools/matter_branches.py tools/matter_autopilot.py tests/test_matter_ai_cli.py tests/test_matter_branches.py tests/test_matter_autopilot.py
      - name: Offline agent permissions and repository graph tests
        run: python -m unittest discover -s tests -p 'test_matter_*.py' -v
      - name: Offline projects command
        run: python tools/matter_ai.py projects
      - name: Shell installer syntax and nonprivileged help (Linux only)
        if: runner.os == 'Linux'
        run: |
          bash -n tools/install-matter-ai.sh tools/setup-sakura.sh
          bash tools/setup-sakura.sh --help
      - name: Systemd unit syntax (Linux only)
        if: runner.os == 'Linux'
        run: |
          systemd-analyze verify tools/matter-autopilot.service
          python3 tools/matter_autopilot.py preview
