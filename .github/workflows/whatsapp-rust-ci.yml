name: whatsapp-rust provider offline verification

on:
  push:
    branches: [alpha, beta, stable, matter-beta]
    paths:
      - "providers/whatsapp-rust/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/whatsapp-rust-ci.yml"
  pull_request:
    branches: [alpha, beta, stable, matter-beta, matter]

permissions:
  contents: read

jobs:
  rust-whatsapp:
    name: Pairing-code Rust provider build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "providers/whatsapp-rust -> target"
      - name: Format standalone provider
        run: cargo fmt --manifest-path providers/whatsapp-rust/Cargo.toml --all -- --check
      - name: Compile provider and upstream whatsapp-rust
        run: cargo check --manifest-path providers/whatsapp-rust/Cargo.toml --all-targets
      - name: Test offline provider contracts
        run: cargo test --manifest-path providers/whatsapp-rust/Cargo.toml --all-targets
      - name: Strict Clippy for provider
        run: cargo clippy --manifest-path providers/whatsapp-rust/Cargo.toml --all-targets -- -D warnings
      - name: CLI help without live connection
        run: cargo run --manifest-path providers/whatsapp-rust/Cargo.toml -- --help
