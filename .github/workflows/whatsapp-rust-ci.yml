name: whatsapp-rust provider offline verification
# Artifacts are published only from tested alpha push SHAs; no session data.

on:
  push:
    branches: [alpha, beta, stable, matter-beta]
    paths:
      - "providers/whatsapp-rust/**"
      - "src/**"
      - "templates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/whatsapp-rust-ci.yml"
  pull_request:
    branches: [alpha, beta, stable, matter-beta, matter]

permissions:
  contents: read

jobs:
  rust-whatsapp:
    name: Pairing-code Rust provider build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "providers/whatsapp-rust -> target"
      - name: Format standalone provider
        run: cargo fmt --manifest-path providers/whatsapp-rust/Cargo.toml --all -- --check
      - name: Compile provider and upstream whatsapp-rust
        run: cargo check --manifest-path providers/whatsapp-rust/Cargo.toml --all-targets
      - name: Test offline provider contracts
        run: cargo test --manifest-path providers/whatsapp-rust/Cargo.toml --all-targets
      - name: Strict Clippy for provider
        run: cargo clippy --manifest-path providers/whatsapp-rust/Cargo.toml --all-targets -- -D warnings
      - name: CLI help without live connection
        run: cargo run --manifest-path providers/whatsapp-rust/Cargo.toml -- --help

      - name: Build verified alpha WhatsApp Rust provider
        if: github.event_name == 'push' && github.ref == 'refs/heads/alpha'
        run: cargo build --manifest-path providers/whatsapp-rust/Cargo.toml

      - name: Package verified alpha provider (no sessions or secrets)
        if: github.event_name == 'push' && github.ref == 'refs/heads/alpha'
        shell: bash
        run: |
          mkdir -p dist-provider
          install -m 0755 providers/whatsapp-rust/target/debug/whatsapp-matter-rust-provider dist-provider/whatsapp-matter-rust-provider
          strip --strip-debug dist-provider/whatsapp-matter-rust-provider
          (cd dist-provider && sha256sum whatsapp-matter-rust-provider > SHA256SUMS)
          printf 'BASE_SHA=%s\n' "$GITHUB_SHA" > dist-provider/BUILD_INFO
          printf 'TARGET=x86_64-unknown-linux-gnu\n' >> dist-provider/BUILD_INFO

      - name: Publish verified provider artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/alpha'
        uses: actions/upload-artifact@v4
        with:
          name: base-alpha-provider-linux-x86_64-${{ github.sha }}
          path: dist-provider/
          if-no-files-found: error
          retention-days: 7
