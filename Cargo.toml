[package]
name = "matter-base"
version = "0.1.0"
edition = "2021"
description = "Universal multilingual and multi-platform bot infrastructure"
license = "MIT"
autobins = false
default-run = "base-matter"

[lib]
name = "matter_base"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
chacha20poly1305 = "0.10"
zeroize = "1.8"
time = { version = "0.3", features = ["parsing"] }
hmac = "0.12"
getrandom = "0.3"
subtle = "2.6"
[[bin]]
name = "whatsapp-matter-control"
path = "src/bin/whatsapp_control.rs"

[[bin]]
name = "base-matter"
path = "src/bin/base_matter.rs"
