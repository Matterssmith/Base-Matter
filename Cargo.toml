
[package]
name = "matter-base"
version = "0.1.0"
edition = "2021"
description = "Universal multilingual and multi-platform bot infrastructure"
license = "MIT"
autobins = false

[lib]
name = "matter_base"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = {
    version = "0.3",
    features = ["env-filter", "fmt"]
}
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
